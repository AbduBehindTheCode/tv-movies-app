@if (showRecommender) {
  <div class="movies__carousel-panel">
    @if (recommendedMovies.length) {
      <span class="movies__title-label">Recommended for you:</span>
      <app-carousel [carouselItems]="recommendedMovies" (cardClicked)="openMovieDetailsDialog($event)" />
    } @else {
      <mat-spinner></mat-spinner>
    }
  </div>
}

@if (movies$ | async; as movies) {
  @for (movie of movies; track movie) {
    <div class="movies__card">
      <app-card
        [name]="movie.title"
        [originalName]="movie.original_title"
        [posterPath]="IMG_URL + '/' + movie.poster_path"
        [overview]="movie.overview"
        [voteCount]="movie.vote_count"
        [voteAverage]="movie.vote_average"
        [additionalInfo]="{ fields: movieOverviewFields, data: movie }"
        (cardClicked)="openMovieDetailsDialog(movie.id)" />
    </div>
  } @empty {
    <div>There are no movies</div>
  }
}
